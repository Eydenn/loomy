name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS : testé en local avant chaque version ; la CI couvre Linux.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq expect tmux shellcheck
      - name: Git
        run: |
          git config --global user.name "loomy-ci"
          git config --global user.email "ci@loomy.invalid"
          git config --global init.defaultBranch main
      - name: Tests
        run: bash tests/run.sh
